<!doctype html><meta charset=utf-8><title>Web Node Demo</title><style>body{font:16px sans-serif;margin:16px}textarea{display:block;width:90%;height:72px}output{margin-left:12px}#mark{width:64px;height:10px;background:#21854d;margin:8px 0}#mark.saved{width:96px;background:#1468ae}</style><label>Note<textarea id=note></textarea></label><div id=mark></div><button id=save>Save</button><output id=status></output><script>
const field=document.querySelector('#note'),button=document.querySelector('#save'),statusText=document.querySelector('#status');
rpc.saved=text=>{statusText.value=text;document.querySelector('#mark').className='saved'};
async function load(){button.disabled=field.disabled=true;try{field.value=await rpc.load()}catch(e){statusText.value=e.message}finally{button.disabled=field.disabled=false}}load();
button.onclick=async()=>{button.disabled=true;statusText.value='Saving';try{await rpc.save(field.value)}catch(e){statusText.value=e.message}finally{button.disabled=false}};
</script>
