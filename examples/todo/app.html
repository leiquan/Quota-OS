<!doctype html>
<style>
body{font:15px sans-serif;background:#f4f7f6;color:#243;margin:16px}b{font-size:22px}
small,section button{float:right}
input,button,section{border:1px solid #bcb;border-radius:5px;padding:5px}
#add:enabled{background:#177768;color:white}
section{background:#fff;margin:4px 0}
section:has(:checked){text-decoration:line-through}
</style>
<b>Todo</b><small id=count></small><hr>
<input id=entry maxlength=36 placeholder="New task"><button id=add disabled>Add</button>
<label><input id=filter type=checkbox>Open only</label>
<main id=rows></main><output id=msg></output>
<script>
(async () => {
  let tasks = await rpc.get('list'), busy;
  const input = entry;
  function render() {
    rows.innerHTML = '';
    count.textContent = tasks.filter(t => !t[1]).length + ' open / ' + tasks.length;
    tasks.forEach(([text, done], i) => {
      if (done && filter.checked) return;
      const row = rows.appendChild(document.createElement('section'));
      row.innerHTML = '<input type=checkbox><button>Delete</button>';
      const toggle = row.firstChild;
      toggle.after(text);
      toggle.checked = done;
      toggle.onclick = () => save(tasks.with(i,[text,!done]));
      row.lastChild.onclick = () => save(tasks.toSpliced(i,1));
    });
  }
  async function save(next) {
    if (busy) return render();
    busy = true;
    try {
      await rpc.get('save', next);
      tasks = next;
      msg.textContent = 'Saved';
      return true;
    } catch (e) { msg.textContent = e.message; }
    finally { busy = false; render(); }
  }
  render();
  add.disabled = false;
  filter.onchange = render;
  add.onclick = async () => {
    const text = input.value.trim();
    if (text && await save([...tasks,[text,false]])) input.value = '';
  };
  input.onkeydown = e => { if (e.key === 'Enter') add.click(); };
})().catch(e => msg.textContent = e.message);
</script>
